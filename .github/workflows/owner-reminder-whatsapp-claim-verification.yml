name: owner-reminder-whatsapp-claim-verification

# Final gap-closure pass (Carson Engineering Hardening Project): no longer
# path-filtered at the workflow-trigger level, for the same reason Phase 6
# removed carson-tier1-db-contracts.yml's filter — a required check that
# never runs on an unrelated PR deadlocks it forever. Triggers on every PR
# to main; an internal "Determine relevance" step (git diff against the
# PR base) gates the expensive Postgres steps, not the job itself, so an
# unrelated PR still gets a genuine, fast success.
"on":
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: owner-reminder-whatsapp-claim-verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ci_verify
      MIGRATIONS: ra7etbal-v2/supabase/migrations
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Determine relevance
        id: relevance
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE_SHA" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "$CHANGED"
          PATTERN='^ra7etbal-v2/supabase/migrations/(20260811_owner_reminder_whatsapp_delivery\.sql|verification/owner_reminder_whatsapp_.*\.sql)$|^\.github/workflows/owner-reminder-whatsapp-claim-verification\.yml$'
          if echo "$CHANGED" | grep -Eq "$PATTERN"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Wait for PostgreSQL
        if: steps.relevance.outputs.relevant == 'true'
        run: pg_isready
      - name: Bootstrap minimal WhatsApp delivery schema
        if: steps.relevance.outputs.relevant == 'true'
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/verification/owner_reminder_whatsapp_bootstrap.sql"
      - name: Apply owner reminder migration
        if: steps.relevance.outputs.relevant == 'true'
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/20260811_owner_reminder_whatsapp_delivery.sql"
      - name: Verify partial unique claim lifecycle
        if: steps.relevance.outputs.relevant == 'true'
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/verification/owner_reminder_whatsapp_claim_verification.sql"
