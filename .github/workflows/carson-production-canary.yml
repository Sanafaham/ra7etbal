name: carson-production-canary

# Phase 7 of the Carson Engineering Hardening Project.
#
# workflow_dispatch ONLY — this must never run on a pull_request. It reads
# live production (Vercel deployment metadata + Supabase, read-only) and
# has no business running as part of an ordinary PR build; that would also
# make it a merge gate, which it explicitly is not (Phase 7 does not touch
# branch protection).
#
# Every check this workflow runs is read-only — see
# ra7etbal-v2/scripts/carson-production-canary.mjs's own header comment
# for the full safety contract. It cannot send a WhatsApp message, push
# notification, or create/alter any task, reminder, automation, or owner
# decision.
#
# Requires two repository secrets (VERCEL_TOKEN, CANARY_RPC_TOKEN) and
# three non-secret repository variables (VERCEL_PROJECT_ID, SUPABASE_URL,
# SUPABASE_PUBLISHABLE_KEY). GitHub Actions never receives
# SUPABASE_SERVICE_ROLE_KEY. CANARY_RPC_TOKEN authorizes only the bounded,
# aggregate-only carson_production_canary_health RPC. Until Sana configures
# these values, the live-production step fails loudly with a clear
# explanation rather than silently reporting a false success. The canary's own
# test suite (fixture-based, no live credentials needed) always runs
# regardless, on every dispatch.

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Expected production githubCommitSha (defaults to the SHA this workflow run itself is on)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  carson-production-canary:
    name: carson-production-canary
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ra7etbal-v2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ra7etbal-v2/package-lock.json
      - run: npm ci

      - name: Run the canary's own fixture-based test suite (always — no live credentials required)
        run: npm run test:carson-production-canary

      - name: Check required canary configuration
        id: config_check
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_CANARY_RPC_TOKEN: ${{ secrets.CANARY_RPC_TOKEN != '' }}
          HAS_VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID != '' }}
          HAS_SUPABASE_URL: ${{ vars.SUPABASE_URL != '' }}
          HAS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY != '' }}
        run: |
          if [ "$HAS_VERCEL_TOKEN" != "true" ] || [ "$HAS_CANARY_RPC_TOKEN" != "true" ] || [ "$HAS_VERCEL_PROJECT_ID" != "true" ] || [ "$HAS_SUPABASE_URL" != "true" ] || [ "$HAS_SUPABASE_PUBLISHABLE_KEY" != "true" ]; then
            echo "::error::carson-production-canary requires secrets VERCEL_TOKEN/CANARY_RPC_TOKEN and variables VERCEL_PROJECT_ID/SUPABASE_URL/SUPABASE_PUBLISHABLE_KEY. SUPABASE_SERVICE_ROLE_KEY is deliberately forbidden. Failing loudly rather than reporting a false success."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Run the live production canary
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
          CANARY_RPC_TOKEN: ${{ secrets.CANARY_RPC_TOKEN }}
          EXPECTED_PRODUCTION_SHA: ${{ inputs.expected_sha || github.sha }}
        run: npm run carson:production-canary
