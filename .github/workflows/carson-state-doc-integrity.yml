name: carson-state-doc-integrity

# Phase 5 of the Carson Engineering Hardening Project.
#
# Compares this PR's proposed RA7ETBAL_STATE.md against the correct base
# version from main and fails when a previously CLOSED/PROTECTED/PRODUCTION
# VERIFIED section either silently regresses to a non-closed status with no
# explicit, genuinely new "**Correction (date): ...**" / "**Update
# (date): ...**" reopen marker in its body, or disappears entirely (which
# has no marker-based exception at all — a closed section must never simply
# be deleted) — see ra7etbal-v2/scripts/state-doc-integrity.mjs for the
# full mechanism and its real-history counterfactual test.
#
# Phase 6: no longer path-filtered. This check's own cost is small (no
# Postgres service, a lightweight unit-test suite, one node invocation), so
# there is no expensive work worth conditionally skipping — it simply runs
# on every PR. This also matters for correctness, not just deadlock-safety:
# a required GitHub check that only runs when RA7ETBAL_STATE.md itself
# changed would never run on a PR that changed something else, so it would
# never appear at all on such a PR and permanently block it (a deadlock).
# Running unconditionally is both simpler and safe — when RA7ETBAL_STATE.md
# isn't touched, the base and proposed content are identical and the
# checker trivially reports zero findings.
"on":
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  carson-state-doc-integrity:
    name: carson-state-doc-integrity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ra7etbal-v2
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required so `git show <base_sha>:RA7ETBAL_STATE.md`
          # can resolve the PR's true base version, not just a shallow slice.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ra7etbal-v2/package-lock.json
      - run: npm ci

      - name: Run the state-doc integrity checker's own test suite (includes the real historical regression counterfactual)
        run: npm run test:carson-state-integrity

      - name: Check this PR's RA7ETBAL_STATE.md against the PR base for stale-state regressions
        run: |
          node scripts/state-doc-integrity.mjs \
            --base="${{ github.event.pull_request.base.sha }}" \
            --head="${{ github.event.pull_request.head.sha }}"
