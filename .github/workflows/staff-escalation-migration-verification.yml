name: staff-escalation-migration-verification

# Focused, path-filtered — unlike carson-protected-behaviors.yml this only
# needs to run when the Phase A owner-escalation migration files or this
# workflow itself change. Verifies the migration against a genuine,
# ephemeral PostgreSQL service (not Supabase, not production): applies the
# two real prerequisite migrations plus the new forward migration, runs a
# full real-database lifecycle/RLS/grants/atomicity verification, applies
# the rollback, verifies cleanup and pre-existing-data preservation,
# reapplies the forward migration, and reruns the lifecycle verification.

"on":
  pull_request:
    branches: [main]
    paths:
      - "ra7etbal-v2/supabase/migrations/20260720_create_staff_messages.sql"
      - "ra7etbal-v2/supabase/migrations/20260724_staff_message_response_delivery.sql"
      - "ra7etbal-v2/supabase/migrations/20260726_staff_escalation_owner_decisions.sql"
      - "ra7etbal-v2/supabase/migrations/20260726_staff_escalation_owner_decisions.rollback.sql"
      - "ra7etbal-v2/supabase/migrations/verification/**"
      - ".github/workflows/staff-escalation-migration-verification.yml"
  push:
    branches: [feat/staff-escalation-owner-decisions-schema]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    name: staff-escalation-migration-verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ci_verify
      MIGRATIONS: ra7etbal-v2/supabase/migrations
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Postgres
        run: pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER"

      - name: Bootstrap minimal auth-compatible schema
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/verification/00_bootstrap_minimal_auth.sql"

      - name: Apply prerequisite migration — create_staff_messages
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/20260720_create_staff_messages.sql"

      - name: Apply prerequisite migration — staff_message_response_delivery
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/20260724_staff_message_response_delivery.sql"

      - name: Insert pre-existing-data fixture (must survive rollback)
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/verification/01_preexisting_data_fixture.sql"

      - name: Apply forward migration — staff_escalation_owner_decisions
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/20260726_staff_escalation_owner_decisions.sql"

      - name: Real-database lifecycle verification (first apply)
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/verification/02_lifecycle_verification.sql"

      - name: Apply rollback migration
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/20260726_staff_escalation_owner_decisions.rollback.sql"

      - name: Post-rollback verification (cleanup + data preservation)
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/verification/03_post_rollback_verification.sql"

      - name: Reapply forward migration
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/20260726_staff_escalation_owner_decisions.sql"

      - name: Real-database lifecycle verification (after reapply)
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/verification/02_lifecycle_verification.sql"
