name: ai-consent-authority-verification
"on":
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    name: ai-consent-real-postgres-proof
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_verify
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: ci_verify
      MIGRATIONS: ra7etbal-v2/supabase/migrations
    steps:
      - uses: actions/checkout@v4
      - run: pg_isready
      - name: Bootstrap Supabase-compatible auth roles
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/verification/ai_consent_authority_bootstrap.sql"
      - name: Apply exact forward migration
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/20261004120000_ai_consent_authority_foundation.sql"
      - name: Prove RLS, RPC, replay, withdrawal and immutability contracts
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/verification/ai_consent_authority_verification.sql"
      - name: Apply bounded rollback
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/20261004120000_ai_consent_authority_foundation.rollback.sql"
      - name: Prove rollback stayed inside Slice 1 boundary
        run: psql -v ON_ERROR_STOP=1 -f "$MIGRATIONS/verification/ai_consent_authority_rollback_verification.sql"
